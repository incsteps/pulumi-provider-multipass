name: release

# Publishes the provider so downstream stacks can consume it without a source
# checkout. Tag a version to trigger it:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Two artifacts come out:
#   1. Plugin tarballs attached to the GitHub release. The provider advertises
#      pluginDownloadURL = github://api.github.com/incsteps/pulumi-provider-multipass,
#      so `pulumi plugin install resource multipass v0.1.0` resolves them here.
#      Asset names MUST stay in Pulumi's convention:
#        pulumi-resource-<name>-v<version>-<os>-<arch>.tar.gz
#   2. The nodejs SDK, published to npm as @incsteps/pulumi-multipass.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.1.0). Dry run — publishes nothing."
        required: true

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  plugins:
    name: build plugin tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            bin="pulumi-resource-multipass"
            [ "$os" = "windows" ] && bin="$bin.exe"
            echo "==> $os/$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "dist/$bin" ./cmd/pulumi-resource-multipass
            tar -czf "dist/pulumi-resource-multipass-${VERSION}-${os}-${arch}.tar.gz" -C dist "$bin"
            rm -f "dist/$bin"
          done
          ls -la dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  npm:
    name: publish nodejs SDK
    needs: plugins
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build SDK
        working-directory: sdk/nodejs
        run: |
          npm install
          npm run build
          # `make gen-sdk` regenerates this package.json from the schema and drops
          # the entry points, so reassert them here. Without `main` the published
          # package is unloadable: Pulumi's Node runtime falls back to index.js in
          # the package root, finds only TypeScript sources, and fails with
          #   SyntaxError: Cannot use import statement outside a module
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.main = "bin/index.js";
            p.types = "bin/index.d.ts";
            p.files = ["bin"];
            fs.writeFileSync("package.json", JSON.stringify(p, null, 4) + "\n");
          '
          cp README.md bin/ 2>/dev/null || true

      # A tarball that ships .ts without a compiled entry point installs cleanly
      # and only fails at `pulumi up`, which is the worst place to find out.
      - name: Verify the tarball is loadable
        working-directory: sdk/nodejs
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map(f => f.path);
            const entry = files.includes("bin/index.js");
            const ts = files.filter(f => f.endsWith(".ts") && !f.endsWith(".d.ts"));
            if (!entry) { console.error("FAIL: bin/index.js is not in the tarball"); process.exit(1); }
            if (ts.length) { console.error("FAIL: TypeScript sources would ship: " + ts.join(", ")); process.exit(1); }
            console.log("ok: " + files.length + " files, compiled entry point present");
          '

      - name: Publish
        working-directory: sdk/nodejs
        run: npm publish --access public
